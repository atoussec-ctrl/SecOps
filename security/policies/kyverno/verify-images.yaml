apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-atoussec-ghcr-images
spec:
  failurePolicy: Fail
  validationActions:
    - Deny
  webhookConfiguration:
    timeoutSeconds: 15
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods
  matchImageReferences:
    - glob: "ghcr.io/atoussec-ctrl/*"
  attestors:
    - name: github-actions-keyless
      cosign:
        keyless:
          identities:
            - subjectRegExp: "https://github\\.com/atoussec-ctrl/.+/.github/workflows/.+@refs/(heads/main|tags/.+)"
              issuer: "https://token.actions.githubusercontent.com"
        rekor:
          url: https://rekor.sigstore.dev
