# Do not edit by hand: `node tools/repo.mjs check:workflows` fails when this
# file differs from the descriptor it is rendered from.
name: Supply chain smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sign-attest:
    name: Build once, scan, sign and attest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up the pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.1"
      - name: Build the deterministic fixture exactly once
        run: docker build --tag secops-supply-chain-fixture:ci tests/pipeline/fixtures/release-image
      - name: Scan the built image with pinned Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: "image"
          image-ref: "secops-supply-chain-fixture:ci"
          exit-code: "1"
          ignore-unfixed: "false"
          severity: "HIGH,CRITICAL"
          scanners: "vuln"
          cache: "false"
          version: "v0.70.0"
      - name: Generate SPDX JSON SBOM with pinned Syft
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
        with:
          image: "secops-supply-chain-fixture:ci"
          format: "spdx-json"
          output-file: "sbom.spdx.json"
          syft-version: "v1.51.1"
          dependency-snapshot: "false"
          upload-artifact: "false"
          upload-release-assets: "false"
      - name: Authenticate to GHCR with the repository token
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: "ghcr.io"
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the already scanned image and capture its registry digest
        id: push
        run: ref="ghcr.io/atoussec-ctrl/secops-supply-chain-fixture:$GITHUB_SHA"; docker tag secops-supply-chain-fixture:ci "$ref"; docker push "$ref"; docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' > registry-manifest.json; digest="$(node -e 'const fs=require("fs");const m=JSON.parse(fs.readFileSync("registry-manifest.json","utf8"));if(!/^sha256:[0-9a-f]{64}$/.test(m.digest))process.exit(1);process.stdout.write(m.digest)')"; printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"; printf '%s\n' "$digest" > image-digest.txt
      - name: Generate build provenance for the published digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: "ghcr.io/atoussec-ctrl/secops-supply-chain-fixture"
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: "true"
          create-storage-record: "false"
      - name: Attach the SBOM attestation to the same digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: "ghcr.io/atoussec-ctrl/secops-supply-chain-fixture"
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: "sbom.spdx.json"
          push-to-registry: "true"
          create-storage-record: "false"
      - name: Install the pinned Cosign release
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: "v3.1.3"
      - name: Sign the exact published digest with GitHub OIDC
        run: digest="$(cat image-digest.txt)"; test -n "$digest"; cosign sign --yes "ghcr.io/atoussec-ctrl/secops-supply-chain-fixture@$digest"
      - name: Verify the signature is from the protected main workflow identity
        run: digest="$(cat image-digest.txt)"; cosign verify "ghcr.io/atoussec-ctrl/secops-supply-chain-fixture@$digest" --certificate-identity="https://github.com/atoussec-ctrl/SecOps/.github/workflows/supply-chain-smoke.yml@refs/heads/main" --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
