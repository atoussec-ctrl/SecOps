# Generated from .github/workflow-set.json by tools/workflows.mjs.
# Do not edit by hand: `node tools/repo.mjs check:workflows` fails when this
# file differs from the descriptor it is rendered from.
name: Pull request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  phase-0-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up the pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.18.1"
      - name: Verify local toolchains
        run: node tools/repo.mjs check:prerequisites
      - name: Validate documentation
        run: node tools/repo.mjs check:docs
      - name: Validate contracts
        run: node tools/repo.mjs check:contracts
      - name: Enforce module boundaries
        run: node tools/repo.mjs check:architecture
      - name: Assert lab exposure policy
        run: node tools/repo.mjs check:exposure
      - name: Assert workflow policy
        run: node tools/repo.mjs check:workflows
      - name: Run the foundation suite
        run: node tools/repo.mjs check:foundation
